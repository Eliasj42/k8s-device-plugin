name: Release Helm Charts

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'helm/**/Chart.yaml'
      - 'helm/**/values.yaml'
      - 'helm/**/templates/**'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.16.4

      - name: Install chart-releaser
        run: |
          curl -LO "https://github.com/helm/chart-releaser/releases/download/v1.6.1/chart-releaser_1.6.1_linux_amd64.tar.gz"
          tar -xzf chart-releaser_1.6.1_linux_amd64.tar.gz
          sudo mv cr /usr/local/bin/cr

      - name: Package charts
        run: cr package helm/amd-gpu

      - name: Release charts
        run: |
          cr upload \
            --owner ${{ github.repository_owner }} \
            --git-repo ${{ github.event.repository.name }} \
            --release-name-template "{{ .Name }}-helm-{{ .Version }}" \
            --package-path .cr-release-packages || echo "Release may already exist, continuing..."
        continue-on-error: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Update index
        run: |
          cr index \
            --owner ${{ github.repository_owner }} \
            --git-repo ${{ github.event.repository.name }} \
            --release-name-template "{{ .Name }}-helm-{{ .Version }}" \
            --pages-branch helm-chart-release \
            --package-path .cr-release-packages
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
